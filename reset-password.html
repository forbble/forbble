<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        /* Forbble Dark Theme - Minimalist */
        :root {
            --background: #121212;
            --surface: #1E1E1E;
            --card: #242424;
            --divider: #2D2D2D;
            --text: #FFFFFF;
            --text-secondary: #A0A0A0;
            --text-hint: #6D6D6D;
            --button: #FFFFFF;
            --button-text: #121212;
            --error: #F44336;
            --success: #4CAF50;
            --border-radius: 12px;
            --padding: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--surface);
            border-radius: var(--border-radius);
            padding: 40px;
            border: 1px solid var(--divider);
        }

        .title {
            font-size: 22px;
            font-weight: 300;
            margin-bottom: 32px;
            color: var(--text);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 300;
        }

        .form-input {
            width: 100%;
            padding: 16px;
            background-color: var(--card);
            border: 1px solid var(--divider);
            border-radius: var(--border-radius);
            color: var(--text);
            font-size: 15px;
            font-weight: 300;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--text);
        }

        .form-input.error {
            border-color: var(--error);
        }

        .error-message {
            color: var(--error);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .success-message {
            color: var(--success);
            font-size: 14px;
            margin-top: 16px;
            text-align: center;
            display: none;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background-color: var(--button);
            color: var(--button-text);
            border: none;
            border-radius: var(--border-radius);
            font-size: 15px;
            font-weight: 400;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--button-text);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-container {
            text-align: center;
            padding: 40px 20px;
        }

        .status-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .status-title {
            font-size: 22px;
            margin-bottom: 12px;
            font-weight: 300;
        }

        .status-message {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border: none;
                background-color: transparent;
            }
            
            body {
                padding: 0;
                background-color: var(--background);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="resetForm">
            <div class="title">Reset Password</div>
            
            <form id="passwordResetForm">
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" 
                           id="newPassword" 
                           class="form-input" 
                           placeholder="Enter new password"
                           autocomplete="new-password"
                           required>
                    <div id="newPasswordError" class="error-message"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" 
                           id="confirmPassword" 
                           class="form-input" 
                           placeholder="Re-enter new password"
                           autocomplete="new-password"
                           required>
                    <div id="confirmPasswordError" class="error-message"></div>
                </div>
                
                <button type="submit" id="submitBtn" class="btn">
                    <span id="btnText">Reset Password</span>
                    <div id="btnLoading" class="loading" style="display: none;"></div>
                </button>
                
                <div id="successMessage" class="success-message"></div>
            </form>
        </div>
        
        <div id="successState" class="status-container" style="display: none;">
            <div class="status-icon">✓</div>
            <div class="status-title">Password Reset</div>
            <div class="status-message">Your password has been successfully reset.</div>
            <button onclick="window.location.href='https://forbble.com'" class="btn">Return to Forbble</button>
        </div>
        
        <div id="errorState" class="status-container" style="display: none;">
            <div class="status-icon">!</div>
            <div class="status-title">Reset Failed</div>
            <div class="status-message" id="errorMessage">The reset link is invalid or has expired.</div>
            <button onclick="window.location.href='https://forbble.com'" class="btn">Return to Forbble</button>
        </div>
    </div>

    <script>
        // Get token from URL (Supabase uses 'code' parameter for reset links)
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('code');
        const accessToken = urlParams.get('access_token');
        
        // Check if this is a valid reset link
        if (!resetToken && !accessToken) {
            showErrorState('Invalid or expired reset link.');
        }
        
        // DOM Elements
        const resetForm = document.getElementById('resetForm');
        const successState = document.getElementById('successState');
        const errorState = document.getElementById('errorState');
        const passwordResetForm = document.getElementById('passwordResetForm');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        const successMessage = document.getElementById('successMessage');
        
        // Validation functions matching Flutter app
        function validatePassword(password) {
            const errors = [];
            
            if (password.length < 8) {
                errors.push('Minimum 8 characters');
            }
            
            if (password.length > 128) {
                errors.push('Maximum 128 characters');
            }
            
            if (!/[A-Z]/.test(password)) {
                errors.push('At least one uppercase letter (A-Z)');
            }
            
            if (!/[a-z]/.test(password)) {
                errors.push('At least one lowercase letter (a-z)');
            }
            
            if (!/[0-9]/.test(password)) {
                errors.push('At least one number (0-9)');
            }
            
            if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
                errors.push('At least one special character (!@#$%^&*)');
            }
            
            // No repeated characters beyond 3 times (aaaa)
            if (/(.)\1\1/.test(password)) {
                errors.push('Avoid repeated characters (aaaa, 1111)');
            }
            
            // Common password check (same as Flutter app)
            const commonPasswords = [
                'password', '12345678', 'qwerty123', 'admin123', 'letmein',
                'welcome', 'monkey', 'password1', 'abc123', 'football',
                '123456789', '1234567890', 'qwertyuiop', '123123123',
                'iloveyou', 'sunshine', 'princess', '123qwe', '1234',
                '111111', '12345', '123456', '1234567', '123456789',
                '12345678910'
            ];
            
            if (commonPasswords.includes(password.toLowerCase())) {
                errors.push('Password is too common');
            }
            
            return {
                isValid: errors.length === 0,
                errors: errors
            };
        }
        
        function validateConfirmPassword(password, confirm) {
            if (!confirm) {
                return {
                    isValid: false,
                    error: 'Confirm your password'
                };
            }
            
            if (password !== confirm) {
                return {
                    isValid: false,
                    error: 'Passwords do not match'
                };
            }
            
            return {
                isValid: true,
                error: ''
            };
        }
        
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
            
            // Add error class to input
            if (elementId === 'newPasswordError') {
                newPasswordInput.classList.add('error');
            } else if (elementId === 'confirmPasswordError') {
                confirmPasswordInput.classList.add('error');
            }
        }
        
        function clearError(elementId) {
            const element = document.getElementById(elementId);
            element.textContent = '';
            element.style.display = 'none';
            
            // Remove error class from input
            if (elementId === 'newPasswordError') {
                newPasswordInput.classList.remove('error');
            } else if (elementId === 'confirmPasswordError') {
                confirmPasswordInput.classList.remove('error');
            }
        }
        
        function showLoading(show) {
            if (show) {
                btnText.style.display = 'none';
                btnLoading.style.display = 'inline-block';
                submitBtn.disabled = true;
            } else {
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                submitBtn.disabled = false;
            }
        }
        
        function showErrorState(message) {
            resetForm.style.display = 'none';
            errorState.style.display = 'block';
            document.getElementById('errorMessage').textContent = message;
        }
        
        function showSuccessState() {
            resetForm.style.display = 'none';
            successState.style.display = 'block';
        }
        
        // Real-time validation
        newPasswordInput.addEventListener('input', function() {
            clearError('newPasswordError');
        });
        
        confirmPasswordInput.addEventListener('input', function() {
            clearError('confirmPasswordError');
        });
        
        // Form submission
        passwordResetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Clear previous errors
            clearError('newPasswordError');
            clearError('confirmPasswordError');
            
            // Get values
            const password = newPasswordInput.value;
            const confirm = confirmPasswordInput.value;
            
            // Validate password
            const passwordValidation = validatePassword(password);
            if (!passwordValidation.isValid) {
                showError('newPasswordError', passwordValidation.errors[0]);
                return;
            }
            
            // Validate password confirmation
            const confirmValidation = validateConfirmPassword(password, confirm);
            if (!confirmValidation.isValid) {
                showError('confirmPasswordError', confirmValidation.error);
                return;
            }
            
            // Show loading state
            showLoading(true);
            
            try {
                // Use the Supabase REST API to update password with the reset token
                const supabaseUrl = 'https://xzehukwzazozqljatjdl.supabase.co';
                const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6ZWh1a3d6YXpvenFsamF0amRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjU4MjMzODYsImV4cCI6MjA4MTM5OTM4Nn0.7r5g4NXNQWl7v-EK8UcZ8RG8pLr4KpVwmlJpuJHnODc';
                
                // Method 1: Try with access_token (for OAuth flow)
                if (accessToken) {
                    const response = await fetch(`${supabaseUrl}/auth/v1/user`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${accessToken}`,
                            'Content-Type': 'application/json',
                            'apikey': supabaseKey
                        },
                        body: JSON.stringify({
                            password: password
                        })
                    });
                    
                    if (response.ok) {
                        showSuccessState();
                        return;
                    }
                }
                
                // Method 2: Try with code parameter (for email reset flow)
                if (resetToken) {
                    // First, exchange the code for a session
                    const sessionResponse = await fetch(`${supabaseUrl}/auth/v1/verify`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': supabaseKey
                        },
                        body: JSON.stringify({
                            type: 'recovery',
                            token: resetToken
                        })
                    });
                    
                    if (!sessionResponse.ok) {
                        throw new Error('Invalid or expired reset token');
                    }
                    
                    const sessionData = await sessionResponse.json();
                    
                    // Then update password with the access token
                    const updateResponse = await fetch(`${supabaseUrl}/auth/v1/user`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${sessionData.access_token}`,
                            'Content-Type': 'application/json',
                            'apikey': supabaseKey
                        },
                        body: JSON.stringify({
                            password: password
                        })
                    });
                    
                    if (updateResponse.ok) {
                        showSuccessState();
                        return;
                    } else {
                        const errorData = await updateResponse.json();
                        throw new Error(errorData.msg || 'Failed to reset password');
                    }
                }
                
                // If neither method worked
                throw new Error('Invalid reset link');
                
            } catch (error) {
                console.error('Reset error:', error);
                
                // Show appropriate error message
                let errorMessage = 'Failed to reset password. ';
                
                if (error.message.includes('Invalid') || error.message.includes('expired')) {
                    errorMessage = 'Reset link is invalid or has expired. Please request a new one.';
                } else if (error.message.includes('weak')) {
                    errorMessage = 'Password is too weak. Please use a stronger password.';
                } else if (error.message.includes('rate limit')) {
                    errorMessage = 'Too many attempts. Please try again later.';
                } else {
                    errorMessage = 'An error occurred. Please try again.';
                }
                
                showError('newPasswordError', errorMessage);
            } finally {
                showLoading(false);
            }
        });
        
        // Security: Clear tokens from URL after use (client-side only)
        if (window.history.replaceState) {
            const cleanURL = window.location.origin + window.location.pathname;
            window.history.replaceState({}, document.title, cleanURL);
        }
        
        // Auto-focus on password field
        window.addEventListener('load', () => {
            newPasswordInput.focus();
        });
    </script>
</body>
</html>
