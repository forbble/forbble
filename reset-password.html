<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1E1E1E;
            --card-color: #242424;
            --divider-color: #2D2D2D;
            --text-color: #FFFFFF;
            --text-secondary: #A0A0A0;
            --text-hint: #6D6D6D;
            --button-color: #FFFFFF;
            --button-text: #121212;
            --error-color: #F44336;
            --success-color: #4CAF50;
            --border-radius: 12px;
            --padding-large: 20px;
            --padding-medium: 16px;
            --padding-small: 8px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--padding-large);
        }
        
        .container {
            width: 100%;
            max-width: 400px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: var(--padding-large);
            font-size: 24px;
            font-weight: 300;
            letter-spacing: -0.5px;
        }
        
        .card {
            background-color: var(--card-color);
            border-radius: var(--border-radius);
            padding: var(--padding-large);
            border: 1px solid var(--divider-color);
        }
        
        .title {
            font-size: 22px;
            font-weight: 300;
            margin-bottom: var(--padding-small);
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 300;
            margin-bottom: var(--padding-large);
            line-height: 1.4;
        }
        
        .form-group {
            margin-bottom: var(--padding-medium);
        }
        
        label {
            display: block;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 300;
            margin-bottom: 4px;
        }
        
        input {
            width: 100%;
            padding: 14px 16px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--divider-color);
            border-radius: var(--border-radius);
            color: var(--text-color);
            font-size: 15px;
            font-weight: 300;
            outline: none;
            transition: border-color 0.2s;
        }
        
        input:focus {
            border-color: var(--text-color);
        }
        
        .error {
            color: var(--error-color);
            font-size: 12px;
            font-weight: 300;
            margin-top: 4px;
            display: none;
        }
        
        .success {
            color: var(--success-color);
            font-size: 12px;
            font-weight: 300;
            margin-top: 4px;
            display: none;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            border-radius: var(--border-radius);
            font-size: 15px;
            font-weight: 300;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: var(--padding-small);
        }
        
        button:hover {
            opacity: 0.9;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--button-text);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .back-link {
            display: block;
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 300;
            text-decoration: none;
            margin-top: var(--padding-large);
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Forbble</div>
        
        <div class="card">
            <h1 class="title">Reset Password</h1>
            <p class="subtitle">Enter your new password below. Make sure it's strong and secure.</p>
            
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required minlength="8">
                    <div class="error" id="passwordError"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" required>
                    <div class="error" id="confirmError"></div>
                </div>
                
                <button type="submit" id="submitBtn">
                    <span id="btnText">Reset Password</span>
                </button>
            </form>
            
            <div class="success" id="successMessage"></div>
            <div class="error" id="errorMessage"></div>
            
            <a href="https://forbble.com" class="back-link">Back to Home</a>
        </div>
    </div>

    <script>
        // Get token from URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const type = urlParams.get('type');
        
        if (!token || type !== 'recovery') {
            document.getElementById('errorMessage').textContent = 'Invalid or expired reset link.';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('resetPasswordForm').style.display = 'none';
        }
        
        // Password validation
        function validatePassword(password) {
            if (password.length < 8) return 'Minimum 8 characters';
            if (!/[A-Z]/.test(password)) return 'At least one uppercase letter';
            if (!/[a-z]/.test(password)) return 'At least one lowercase letter';
            if (!/[0-9]/.test(password)) return 'At least one number';
            if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) return 'At least one special character';
            return '';
        }
        
        // Form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            
            // Clear errors
            document.getElementById('passwordError').style.display = 'none';
            document.getElementById('confirmError').style.display = 'none';
            document.getElementById('errorMessage').style.display = 'none';
            
            // Validate passwords
            const passwordError = validatePassword(newPassword);
            if (passwordError) {
                document.getElementById('passwordError').textContent = passwordError;
                document.getElementById('passwordError').style.display = 'block';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                document.getElementById('confirmError').textContent = 'Passwords do not match';
                document.getElementById('confirmError').style.display = 'block';
                return;
            }
            
            // Disable button and show loading
            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Resetting Password...';
            
            try {
                // Call Supabase API to update password
                const response = await fetch('https://xzehukwzazozqljatjdl.supabase.co/auth/v1/verify', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        token: token,
                        type: 'recovery',
                        password: newPassword
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById('successMessage').textContent = 'Password reset successfully! You can now log in with your new password.';
                    document.getElementById('successMessage').style.display = 'block';
                    document.getElementById('resetPasswordForm').style.display = 'none';
                } else {
                    throw new Error(data.msg || 'Failed to reset password');
                }
            } catch (error) {
                document.getElementById('errorMessage').textContent = error.message;
                document.getElementById('errorMessage').style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Reset Password';
            }
        });
        
        // Real-time password validation
        document.getElementById('newPassword').addEventListener('input', function() {
            const error = validatePassword(this.value);
            const errorElement = document.getElementById('passwordError');
            
            if (error && this.value.length > 0) {
                errorElement.textContent = error;
                errorElement.style.display = 'block';
            } else {
                errorElement.style.display = 'none';
            }
        });
        
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const newPassword = document.getElementById('newPassword').value;
            const errorElement = document.getElementById('confirmError');
            
            if (this.value !== newPassword && this.value.length > 0) {
                errorElement.textContent = 'Passwords do not match';
                errorElement.style.display = 'block';
            } else {
                errorElement.style.display = 'none';
            }
        });
    </script>
</body>
</html>
